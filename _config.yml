# Feature List
features:
  - title: HTTPリクエスト送信
    description: GET / POST / PUT / DELETE などの主要メソッドに対応。ヘッダー・クエリパラメータ・ボディを細かく設定してリクエストを送信できます。
    fontawesome_icon_name: paper-plane

  - title: レスポンス表示
    description: ステータスコード・レスポンスタイム・ボディをリアルタイムで確認。JSONのシンタックスハイライト表示にも対応。
    fontawesome_icon_name: code

  - title: 認証サポート
    description: Bearer Token・Basic認証・API Keyなど主要な認証方式に対応。セキュアなAPIへのアクセスもスムーズに。
    fontawesome_icon_name: lock

  - title: コレクション管理
    description: よく使うリクエストをコレクションとして保存・整理。チームや用途別にグループ化して管理できます。
    fontawesome_icon_name: folder-open

  - title: 環境変数
    description: 開発・ステージング・本番など複数の環境を切り替えて使用可能。URLやトークンを変数化して効率よく管理。
    fontawesome_icon_name: sliders-h

  - title: リクエスト履歴
    description: 過去に送信したリクエストを自動保存。いつでも呼び出して再利用・検証が可能です。
    fontawesome_icon_name: history

  - title: Coming Soon...
    description: さらなる機能が続々追加予定です。次回のアップデートをお楽しみに！
    fontawesome_icon_name: arrow-alt-circle-down

  - title: Coming Soon...
    description: さらなる機能が続々追加予定です。次回のアップデートをお楽しみに！
    fontawesome_icon_name: arrow-alt-circle-down

  - title: Coming Soon...
